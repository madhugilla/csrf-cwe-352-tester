name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/CSRFTester.csproj
      
    - name: Build
      run: dotnet build src/CSRFTester.csproj --no-restore
      
    - name: Install Playwright browsers
      run: |
        dotnet tool install --global Microsoft.Playwright.CLI
        playwright install chromium
        
    - name: Run basic functionality test
      run: |
        # Test that the application can start and show help
        dotnet run --project src/CSRFTester.csproj -- --help || true
        
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security scan
      uses: securecodewarrior/github-action-add-sarif@v1
      if: false  # Disabled for now, enable when ready
      with:
        sarif-file: 'security-scan-results.sarif'
